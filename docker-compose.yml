name: credimarket

x-servicio-comun: &servicio-comun
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # ---------- Infraestructura ----------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PRODUCTOS_DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD}
      CLIENTES_DB_PASSWORD: ${CLIENTES_DB_PASSWORD}
      PRESTAMOS_DB_PASSWORD: ${PRESTAMOS_DB_PASSWORD}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # interfaz de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mlflow:
    build: ./infra/mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"

  # ---------- Microservicios de negocio ----------
  productos:
    <<: *servicio-comun
    build: ./services/productos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_NAME: productos
      DATABASE_URL: postgresql+psycopg://productos:${PRODUCTOS_DB_PASSWORD}@postgres:5432/productos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    ports:
      - "8001:8000"

  clientes:
    <<: *servicio-comun
    build: ./services/clientes
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: clientes
      DATABASE_URL: postgresql+psycopg://clientes:${CLIENTES_DB_PASSWORD}@postgres:5432/clientes
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      DEMO_TOKENS_ENABLED: ${DEMO_TOKENS_ENABLED}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    ports:
      - "8002:8000"

  prestamos:
    <<: *servicio-comun
    build: ./services/prestamos
    environment:
      SERVICE_NAME: prestamos
      DATABASE_URL: postgresql+psycopg://prestamos:${PRESTAMOS_DB_PASSWORD}@postgres:5432/prestamos
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      CLIENTES_URL: http://clientes:8000
      PRODUCTOS_URL: http://productos:8000
      MODEL_REGISTRY_DIR: /models
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - ./ml/registry:/models:ro
    ports:
      - "8003:8000"

  inventario:
    <<: *servicio-comun
    build: ./services/inventario
    environment:
      SERVICE_NAME: inventario
      DATABASE_URL: postgresql+psycopg://inventario:${INVENTARIO_DB_PASSWORD}@postgres:5432/inventario
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    ports:
      - "8004:8000"

volumes:
  postgres_data:
  rabbitmq_data:
  mlflow_artifacts:
